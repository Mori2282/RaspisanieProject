<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>113-к - Расписание занятий</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Шапка -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3ca1fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" x2="16" y1="2" y2="6"/>
            <line x1="8" x2="8" y1="2" y2="6"/>
            <line x1="3" x2="21" y1="10" y2="10"/>
          </svg>
          <span>Расписание занятий</span>
        </div>
        <div class="badge-group">
          <span class="badge badge-accent">Группа 113-к</span>
          <span class="badge badge-outline">1 курс</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Панель управления (неделя и переключатель) -->
      <div class="control-card">
        <div class="week-selector">
          <button class="nav-btn" id="prevWeek" title="Предыдущая неделя">‹</button>
          <div class="week-info">
            <span class="week-title" id="weekStatusTitle">Над чертой</span>
            <span class="week-subtitle" id="weekSub">1-я неделя (нечетная)</span>
          </div>
          <button class="nav-btn" id="nextWeek" title="Следующая неделя">›</button>
        </div>

        <div class="segmented-control">
          <button class="segment-btn active" id="btnOdd">Над чертой</button>
          <button class="segment-btn" id="btnEven">Под чертой</button>
        </div>
      </div>

      <!-- Десктопная таблица расписания -->
      <div class="schedule-card desktop-view">
        <div class="table-wrapper">
          <table class="schedule-table">
            <thead>
              <tr id="tableHeaderRow">
                <th class="time-col-header">Время</th>
                <!-- Дни генерятся через JS -->
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Пары генерятся через JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Мобильный вид (список дней) -->
      <div class="mobile-view" id="mobileSchedule">
        <!-- Карточки генерятся через JS -->
      </div>

      <!-- Легенда типов занятий -->
      <div class="legend-card">
        <div class="legend-title">Типы занятий:</div>
        <div class="legend-badges">
          <span class="type-tag type-lecture">Лекция</span>
          <span class="type-tag type-practice">Практика</span>
          <span class="type-tag type-lab">Лабораторная</span>
          <span class="type-tag type-sport">Физкультура</span>
        </div>
      </div>
    </main>
  </div>

  <script src="scheduleData.js"></script>
  <script src="app.js"></script>
</body>
</html>
