<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИТД-41 / 113-к - Расписание занятий</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Шапка -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3ca1fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" x2="16" y1="2" y2="6"/>
            <line x1="8" x2="8" y1="2" y2="6"/>
            <line x1="3" x2="21" y1="10" y2="10"/>
          </svg>
          <span>Расписание занятий</span>
        </div>
        <div class="badge-group">
          <span class="badge badge-accent">113-к</span>
          <span class="badge badge-outline">1 курс</span>
          <span class="badge badge-dot">Дневное</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Панель переключения недель (как в ГГТУ) -->
      <div class="control-card">
        <div class="week-nav-group">
          <button class="nav-btn" id="prevWeek" title="Предыдущая неделя">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="week-center-info">
            <span class="week-dates-text" id="weekDates">19 - 24 октября</span>
            <span class="week-parity-text" id="weekParity">(под чертой)</span>
          </div>
          <button class="nav-btn" id="nextWeek" title="Следующая неделя">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <div class="week-actions">
          <button class="today-btn" id="btnCurrentWeek">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
            Текущая неделя
          </button>
        </div>
      </div>

      <!-- Десктопная сетка с точными датами под днями недели -->
      <div class="schedule-card desktop-view">
        <div class="table-wrapper">
          <table class="schedule-table">
            <thead>
              <tr id="tableHeaderRow">
                <th class="time-col-header"></th>
                <!-- Столбцы с днями и датами генерятся JS -->
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Пары генерятся JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Мобильный вид (в точности как во 2-м скриншоте) -->
      <div class="mobile-view">
        <div class="mobile-week-summary" id="mobileWeekSummary">Октябрь • 8 неделя (под чертой)</div>
        <div class="mobile-day-tabs" id="mobileDayTabs">
          <!-- Табы дней пн 19, вт 20... -->
        </div>
        <div class="mobile-day-title-bar">
          <span id="mobileSelectedDayName">Суббота, 24 октября</span>
        </div>
        <div class="mobile-lessons-container" id="mobileLessonsList">
          <!-- Список пар для выбранного дня -->
        </div>
      </div>

      <!-- Легенда типов занятий -->
      <div class="legend-card">
        <div class="legend-title">Тип занятий:</div>
        <div class="legend-badges">
          <span class="type-tag type-lecture">Лекция</span>
          <span class="type-tag type-practice">Практическое занятие</span>
          <span class="type-tag type-lab">Лабораторная работа</span>
          <span class="type-tag type-sport">Физкультура</span>
        </div>
      </div>
    </main>
  </div>

  <script src="scheduleData.js"></script>
  <script src="app.js"></script>
</body>
</html>
